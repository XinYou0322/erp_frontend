<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vite App</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
<style>
        /* CSS 變數定義 */
        :root {
            /* 顏色變數 */
            --color-background: #f9faf2;
            --color-surface: #f9faf2;
            --color-surface-container-lowest: #ffffff;
            --color-surface-container-low: #f3f4ed;
            --color-surface-container-high: #e7e9e1;
            --color-on-surface: #191c18;
            --color-on-surface-variant: #42493e;
            --color-primary: #6a38df;
            --color-primary-container: #a35ffc;
            --color-on-primary: #ffffff;
            --color-secondary-container: #d0e1fb;
            --color-on-secondary-container: #54647a;
            --color-outline-variant: #c2c9bb;
            --color-error: #ba1a1a;
            --color-error-container: #ffdad6;
            
            /* 間距變數 */
            --space-base: 4px;
            --space-sm: 8px;
            --space-md: 16px;
            --space-lg: 24px;
            --space-margin-desktop: 32px;
            --space-margin-mobile: 16px;
            
            /* 佈局變數 */
            --container-max: 1440px;
            --sidebar-width: 240px;
            --header-height: 64px;
        }

        /* 全局基礎重置 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* 網頁主體設定 */
        body, html {
            height: 100%;
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--color-background);
            color: var(--color-on-surface);
            -webkit-font-smoothing: antialiased;
            overflow: hidden;
        }

        /* Material Symbols 圖示設定 */
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* Material Symbols 實心圖示設定 */
        .material-symbols-outlined.filled {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* 字體排版類別 */
        .font-headline-md { font-size: 22px; line-height: 28px; font-weight: 600; }
        .font-label-md { font-size: 12px; line-height: 16px; font-weight: 500; letter-spacing: 0.05em; }
        .font-display { font-size: 36px; line-height: 44px; font-weight: 700; letter-spacing: -0.02em; }
        .font-body-md { font-size: 14px; line-height: 20px; font-weight: 400; }
        .font-data-mono { font-family: monospace; font-size: 14px; line-height: 20px; font-weight: 500; }

        /* 應用程式主容器 */
        .app-container {
            display: flex;
            height: 100%;
        }

        /* 側邊導航欄 */
        .sidebar {
            display: none;
            flex-direction: column;
            width: var(--sidebar-width);
            background-color: var(--color-surface-container-lowest);
            border-right: 1px solid var(--color-outline-variant);
            position: fixed;
            left: 0;
            top: 0;
            height: 100vh;
            z-index: 30;
            padding: var(--space-md) var(--space-sm);
            gap: var(--space-base);
        }

        /* 側邊導航欄響應式顯示 */
        @media (min-width: 768px) {
            .sidebar { display: flex; }
        }

        /* 側邊欄頂部區域 */
        .sidebar-header {
            padding: 0 var(--space-sm) var(--space-lg);
        }

        /* 品牌商標區塊 */
        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* 品牌商標圖片 */
        .brand img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
        }

        /* 品牌標題文字 */
        .brand-title { color: var(--color-primary); }
        
        /* 品牌副標題文字 */
        .brand-subtitle { color: var(--color-on-surface-variant); }

        /* 側邊欄導航選單 */
        .sidebar-nav {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow-y: auto;
        }

        /* 導航項目 */
        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px var(--space-sm);
            border-radius: 8px;
            color: var(--color-on-surface-variant);
            text-decoration: none;
            transition: all 0.15s;
            cursor: pointer;
        }

        /* 導航項目懸停狀態 */
        .nav-item:hover {
            background-color: var(--color-surface-container-high);
        }

        /* 導航項目點擊狀態 */
        .nav-item:active {
            transform: scale(0.95);
        }

        /* 導航項目作用中狀態 */
        .nav-item.active {
            background-color: var(--color-secondary-container);
            color: var(--color-on-secondary-container);
            font-weight: bold;
        }

        /* 導航項目推至底部 */
        .nav-item.mt-auto { margin-top: auto; }

        /* 側邊欄底部區域 */
        .sidebar-footer {
            padding-top: var(--space-sm);
            margin-top: var(--space-sm);
            border-top: 1px solid var(--color-outline-variant);
        }

        /* 主要按鈕樣式 */
        .btn-primary {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background-color: var(--color-primary-container);
            color: var(--color-on-primary);
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: opacity 0.2s;
            white-space: nowrap;
            text-decoration: none;
        }

        /* 主要按鈕懸停狀態 */
        .btn-primary:hover { opacity: 0.9; }

        /* 主要內容外層 */
        .main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }

        /* 主要內容外層響應式邊距 */
        @media (min-width: 768px) {
            .main-wrapper { padding-left: var(--sidebar-width); }
        }

        /* 頂部導航欄 */
        .top-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 var(--space-md);
            height: var(--header-height);
            position: sticky;
            top: 0;
            z-index: 40;
            background-color: var(--color-surface);
            border-bottom: 1px solid var(--color-outline-variant);
        }

        /* 頂部導航欄左側區塊 */
        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
            flex: 1;
        }

        /* 手機版頂部標題 */
        .mobile-title {
            color: var(--color-primary);
        }

        /* 手機版頂部標題響應式隱藏 */
        @media (min-width: 768px) {
            .mobile-title { display: none; }
        }

        /* 搜尋列容器 */
        .search-container {
            display: none;
            align-items: center;
            max-width: 28rem;
            width: 100%;
            position: relative;
        }

        /* 搜尋列容器響應式顯示 */
        @media (min-width: 768px) {
            .search-container { display: flex; }
        }

        /* 搜尋圖示 */
        .search-icon {
            position: absolute;
            left: 12px;
            color: var(--color-on-surface-variant);
        }

        /* 輸入框樣式 */
        .input-field {
            width: 100%;
            padding: 8px 16px 8px 40px;
            background-color: var(--color-surface-container-lowest);
            border: 1px solid var(--color-outline-variant);
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            color: var(--color-on-surface);
        }

        /* 輸入框聚焦狀態 */
        .input-field:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 1px var(--color-primary);
        }

        /* 透明輸入框背景 */
        .input-field.transparent { background-color: transparent; }

        /* 頂部導航欄右側操作區 */
        .header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        /* 圖示按鈕 */
        .icon-btn {
            color: var(--color-on-surface-variant);
            padding: 8px;
            border-radius: 50%;
            border: none;
            background: none;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        /* 圖示按鈕懸停與點擊狀態 */
        .icon-btn:hover { background-color: var(--color-surface-container-low); }
        .icon-btn:active { opacity: 0.8; }

        /* 使用者頭像 */
        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid var(--color-outline-variant);
            object-fit: cover;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        
        /* 使用者頭像懸停狀態 */
        .avatar:hover { opacity: 0.8; }

        /* 主要內容區域 */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: var(--space-margin-mobile);
            background-color: var(--color-background);
        }

        /* 主要內容區域響應式邊距 */
        @media (min-width: 768px) {
            .main-content { padding: var(--space-margin-desktop); }
        }

        /* 內容容器限制最大寬度 */
        .content-container {
            max-width: var(--container-max);
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: var(--space-lg);
            height: 100%;
        }

        /* 麵包屑導航 */
        .breadcrumbs {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--color-on-surface-variant);
            margin-bottom: 8px;
        }

        /* 麵包屑導航連結 */
        .breadcrumbs a {
            color: inherit;
            text-decoration: none;
            transition: color 0.2s;
        }
        
        /* 麵包屑導航連結懸停狀態 */
        .breadcrumbs a:hover { color: var(--color-primary); }
        
        /* 麵包屑導航當前頁面 */
        .breadcrumbs .current { color: var(--color-on-surface); }

        /* 操作列 (搜尋、篩選、新增按鈕) */
        .action-bar {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            background-color: var(--color-surface-container-lowest);
            padding: var(--space-sm);
            border-radius: 12px;
            border: 1px solid var(--color-outline-variant);
        }

        /* 操作列響應式排版 */
        @media (min-width: 640px) {
            .action-bar {
                flex-direction: row;
                align-items: center;
            }
        }

        /* 篩選器區域 */
        .filters {
            display: flex;
            flex: 1;
            flex-wrap: wrap;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        /* 篩選器區域響應式寬度 */
        @media (min-width: 640px) {
            .filters { width: auto; }
            .filters .search-wrapper { width: 256px; }
        }
        
        /* 篩選器搜尋框外層 */
        .filters .search-wrapper {
            position: relative;
            width: 100%;
        }
        
        /* 篩選器搜尋圖示垂直置中 */
        .filters .search-wrapper .search-icon {
            top: 50%;
            transform: translateY(-50%);
        }

        /* 下拉式選單 */
        .select-field {
            border: 1px solid var(--color-outline-variant);
            border-radius: 8px;
            padding: 8px 12px;
            background-color: transparent;
            color: var(--color-on-surface);
            outline: none;
            appearance: auto;
        }
        
        /* 下拉式選單聚焦狀態 */
        .select-field:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 1px var(--color-primary);
        }

        /* 資料表格卡片 */
        .table-card {
            background-color: var(--color-surface-container-lowest);
            border-radius: 12px;
            border: 1px solid var(--color-outline-variant);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        /* 表格響應式滾動容器 */
        .table-responsive {
            overflow-x: auto;
            flex: 1;
        }

        /* 資料表格主體 */
        .data-table {
            width: 100%;
            text-align: left;
            border-collapse: collapse;
            min-width: 1000px;
        }

        /* 資料表頭 */
        .data-table thead {
            background-color: #F1F5F9;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        /* 資料表頭儲存格 */
        .data-table th {
            padding: 12px 16px;
            color: var(--color-on-surface-variant);
            border-bottom: 1px solid var(--color-outline-variant);
            white-space: nowrap;
        }
        
        /* 表格文字對齊輔助類別 */
        .data-table th.text-right, .data-table td.text-right { text-align: right; }
        .data-table th.text-center, .data-table td.text-center { text-align: center; }

        /* 資料表格列 */
        .data-table tbody tr {
            transition: background-color 0.2s;
            border-bottom: 1px solid var(--color-outline-variant);
        }
        
        /* 資料表格最後一列去除底線 */
        .data-table tbody tr:last-child { border-bottom: none; }
        
        /* 資料表格列懸停狀態 */
        .data-table tbody tr:hover { background-color: #F8FAFC; }

        /* 資料表格內容儲存格 */
        .data-table td { padding: 12px 16px; }
        
        /* 表格 ID 欄位樣式 */
        .td-id { color: var(--color-on-surface-variant); }
        
        /* 表格名稱欄位樣式 */
        .td-name { font-weight: 500; }
        
        /* 表格分類欄位樣式 */
        .td-cat { color: var(--color-on-surface-variant); }
        
        /* 極小文字輔助類別 */
        .text-xs { font-size: 12px; }
        
        /* 單位文字輔助類別 */
        .unit-text { color: var(--color-on-surface-variant); font-weight: normal;}

        /* 狀態標籤 */
        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 8px;
            border-radius: 9999px;
            font-size: 12px;
            font-weight: 700;
        }
        
        /* 正常狀態標籤樣式 */
        .status-normal { background-color: #dcfce7; color: #166534; border: 1px solid #bbf7d0; }
        
        /* 庫存偏低狀態標籤樣式 */
        .status-low { background-color: #fef3c7; color: #92400e; border: 1px solid #fde68a; }
        
        /* 缺貨狀態標籤樣式 */
        .status-out { background-color: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }

        /* 操作按鈕儲存格容器 */
        .actions-cell-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            opacity: 0;
            transition: opacity 0.2s;
        }
        
        /* 懸停列時顯示操作按鈕 */
        .data-table tbody tr:hover .actions-cell-content { opacity: 1; }

        /* 操作按鈕樣式 */
        .action-btn {
            padding: 4px;
            color: var(--color-on-surface-variant);
            background: none;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        /* 操作按鈕懸停狀態 */
        .action-btn:hover { background-color: var(--color-surface-container-high); color: var(--color-primary); }
        
        /* 刪除操作按鈕懸停狀態 */
        .action-btn.delete:hover { background-color: var(--color-error-container); color: var(--color-error); }
        
        /* 操作按鈕內圖示大小 */
        .action-btn .material-symbols-outlined { font-size: 20px; }

        /* 分頁控制列 */
        .pagination-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            border-top: 1px solid var(--color-outline-variant);
            background-color: var(--color-surface-container-lowest);
        }

        /* 分頁資訊文字 */
        .pagination-info {
            color: var(--color-on-surface-variant);
        }

        /* 分頁按鈕群組 */
        .pagination-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 分頁按鈕 */
        .page-btn {
            width: 32px;
            height: 32px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: none;
            border: none;
            color: var(--color-on-surface-variant);
            cursor: pointer;
            transition: background-color 0.2s;
        }
        
        /* 分頁按鈕懸停狀態 */
        .page-btn:hover:not(:disabled) { background-color: var(--color-surface-container-high); }
        
        /* 分頁按鈕停用狀態 */
        .page-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        /* 分頁按鈕作用中狀態 */
        .page-btn.active {
            background-color: var(--color-primary-container);
            color: var(--color-on-primary);
        }
        
        /* 分頁箭頭按鈕特殊樣式 */
        .page-btn.nav-arrow { border: 1px solid var(--color-outline-variant); padding: 4px; width: auto; height: auto;}

        /* 通用輔助類別 */
        /* 錯誤文字顏色 */
        .text-error { color: var(--color-error); }
        /* 警告文字顏色 */
        .text-amber { color: #d97706; }
        /* 粗體文字 */
        .font-bold { font-weight: bold; }
    </style>
